[package]
name = "brotlic-sys"
version = "0.2.5"
edition = "2021"
authors = ["Stefan Zander"]
description = """
Sys crate to wrap the brotli library.
"""
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/brotlic/"
repository = "https://github.com/stefan-zander/brotlic"
keywords = ["brotli", "compression", "decompression"]
categories = ["compression", "api-bindings"]
readme = "README.md"

include = [
	"src/*",
	"LICENSE*",
	"brotli/LICENSE",
	"brotli/c/enc/*",
	"brotli/c/dec/*",
	"brotli/c/common/*",
	"brotli/c/include/*",
	"Cargo.toml",
	"build.rs"
]

[lib]
doctest=false

[build-dependencies]
cc = "1.0"
